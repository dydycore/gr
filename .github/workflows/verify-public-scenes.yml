name: Vérification complète des scènes publiques Grand Remix

on:
  push:
    branches: [ambiances-publiques-v1]
  workflow_dispatch:

jobs:
  verify-netlify-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grand-remix-3d
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: grand-remix-3d/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier et préparer les fichiers Netlify
        run: npm run prepare:netlify
      - name: Vérifier les fichiers de publication
        run: |
          test -s site/index.html
          test -s site/maquette.html
          test -s site/media/Grand_Slam_Logo_Transparent.png
          test -s site/documents/Grand-Remix-Plan-Technique-V18.pdf
          grep -q 'pinky love' site/maquette.html
